name: Spatialedge
description: >-
  Spatialedge is an enterprise AI and data solutions firm headquartered in
  Stellenbosch, South Africa, with offices in London and Austin. The company
  builds and operationalizes analytical tooling that turns data into
  data-driven business decisions, spanning consulting and AI maturity
  assessments, custom solution development (data pipelines, optimization and
  forecasting models, AI-powered applications), integration and deployment
  into existing business systems, and ongoing MLOps and model maintenance.
  Products include Workforce Planner, Price Planner, Demand Forecaster, and
  DataLlume, applied across retail pricing, telecom infrastructure, and mining
  predictive maintenance. Spatialedge does not publish a public API, SDK, or
  developer portal; it is a services and solutions provider surfaced as a
  Techstars portfolio company and profiled in the API Evangelist network.
